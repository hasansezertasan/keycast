---
name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    # Every job below is draft-gated, so leaving draft must explicitly start a
    # fresh run; `ready_for_review` is not part of GitHub's default event types.
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  hooks:
    name: Run prek hooks
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install mise tools
        # ghalint has no PyPI wrapper or pre-commit hook, so the prek `ghalint`
        # hook runs the mise-managed binary. Install mise's tools (incl. ghalint)
        # and put them on PATH before prek runs.
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
      - name: Install headless X server (Linux)
        # The prek `pytest` hook imports the test suite, which imports pynput;
        # pynput imports its Xlib backend at import time and fails with no
        # display. Xvfb provides one (mirrors the style/test jobs).
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run prek hooks
        run: xvfb-run -a uv run --locked --group prek prek run --all-files --show-diff-on-failure
      - name: Verify the generated agent instruction files are committed and current
        # The `ai-rulez` hook above regenerates AGENTS.md/CLAUDE.md/... from
        # `.ai-rulez/`, but a *fixing* hook only fails on a **modified tracked**
        # file: a project that never committed the generated output would have it
        # rewritten as *untracked* files here and stay green, shipping a repo
        # whose agent instructions exist on no branch. Gate on the working tree
        # instead, untracked files included (ADR-035).
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::agent instruction files are missing or stale — run 'uv run --group agents ai-rulez generate' and commit the result"
            git status --short --untracked-files=all
            exit 1
          fi
  style:
    name: Run style and type checks
    # Keep style in one Linux job rather than repeating it for every component.
    # The tox env itself sweeps mypy's platform axes.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install headless X server (Linux)
        # slotscheck imports keycast to verify __slots__, which pulls in pynput;
        # pynput imports its Xlib backend at import time and fails with no
        # display. Xvfb provides one.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run style and type checks
        run: xvfb-run -a uv run --locked tox run -e style
  docs-doctest:
    name: Build and test documentation
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # sphinx-last-updated-by-git needs the full history; on a depth-1 clone
          # it warns "Git clone too shallow" on every page and the warning gate
          # below turns each one into an error.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install headless X server (Linux)
        # Sphinx autodoc imports keycast (display/listeners pull in pynput's X
        # backend at import time); without a display the build fails before it
        # renders anything. Xvfb provides one.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Set reproducible build epoch
        # Pin Sphinx's "today"/copyright to the last commit date so the same
        # commit always renders the same docs output (reproducible-builds.org).
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build documentation with the warning gate
        # docs-build pairs `sphinx-build -w` with docs/check_warnings.py, which
        # fails on any warning outside the allowlist. docs-doctest alone is
        # `-b doctest` with no `-W`, so without this step broken references pass
        # every required check. Runs first: a reference that does not resolve is
        # worth reporting before the doctests that may depend on it.
        run: xvfb-run -a uv run --locked tox run -e docs-build
      - name: Run documentation doctests
        run: xvfb-run -a uv run --locked tox run -e docs-doctest
  cli-installed:
    name: Check installed CLI on ${{ matrix.os }}
    if: ${{ github.event.pull_request.draft != true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install headless X server (Linux)
        # The installed CLI imports keycast, which pulls in pynput's X backend
        # at import time (same reason as the test job below).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run the installed CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a uv run --locked tox run -e cli
          else
            uv run --locked tox run -e cli
          fi

  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Run Tests on ${{ matrix.os }}
    if: ${{ github.event.pull_request.draft != true }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: System Info
        shell: bash
        run: |
          if [[ ${{ matrix.os }} == "ubuntu-latest" ]]; then
              echo "The system is Linux."
              uname -a || true
              lsb_release -a || true
              gcc --version || true
          elif [[ ${{ matrix.os }} == "macos-latest" ]]; then
              echo "The system is macOS."
              sw_vers || true
              uname -a || true
              gcc --version || true
          elif [[ ${{ matrix.os }} == "windows-latest" ]]; then
              echo "The system is Windows (using a Unix-like environment)."
              systeminfo || true
          else
              echo "Unknown OS: $OS_TYPE"
              exit 1
          fi
      - name: Environment Info
        run: |
          env || true
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Restore cache
        if: steps.setup-uv.outputs.cache-hit == 'true'
        run: echo "Cache was restored"
      - name: Install headless X server (Linux)
        # pynput imports its Xlib backend at import time; without a display the
        # test/lint collection fails before anything runs. Xvfb provides one.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run the tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a uv run --locked tox run -e 3.14
          else
            uv run --locked tox run -e 3.14
          fi
      - name: Combine coverage and gate
        # The 3.14 env measures the installed wheel; combine its per-run data
        # and enforce the pyproject `fail_under` gate. Runs everywhere so a
        # platform-gated miss fails against the offending diff, not the release.
        shell: bash
        run: |
          uv run --locked --only-group test coverage combine
          uv run --locked --only-group test coverage report --show-missing
      - name: Render coverage XML (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: uv run --locked --only-group test coverage xml
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage.xml
          # .github/codecov.yml scopes the project status to `flags: [unit]`. An
          # upload with no flag matches no flag-scoped status, so the 99% target
          # would never be computed and `if_ci_failed: error` would be inert.
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
  # Build-only PR guards: build each enabled standalone executable (ADR-007)
  # against the PR diff so a dependency or Python bump that breaks packaging fails
  # HERE, against the offending change, instead of silently at release time. The
  # test suite always runs the source tree, never the built binary, so these jobs
  # are the only thing that exercises packaging before a release. Each verifies the
  # binary was produced and uploads a 7-day preview artifact a reviewer can
  # launch-test. A CLI project is additionally smoke-run with `--help`; non-CLI
  # entrypoints (GUI/TUI/web/MCP/worker) block on a UI/server loop and so are only
  # existence-checked here, never runtime-verified — a reviewer must launch the
  # preview artifact to confirm those actually run. They closely follow the
  # release.yml build jobs (same setup + build commands) but skip the
  # release-only steps (the freezer's per-OS rename, and publishing).
  build-freezer-check:
    if: ${{ github.event.pull_request.draft != true }}
    name: Build Freezer (PyInstaller) on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: ""
          - os: windows-latest
            ext: ".exe"
          - os: macos-latest
            ext: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Build with PyInstaller
        run: uv run --locked --group tool pyinstaller keycast.spec --clean --noconfirm
      - name: Verify the bundle was produced
        shell: bash
        run: |
          bin="./dist/keycast${{ matrix.ext }}"
          test -s "$bin" || { echo "::error::PyInstaller produced no executable"; exit 1; }
          [ "$RUNNER_OS" = Windows ] || test -x "$bin" || { echo "::error::executable is not runnable"; exit 1; }
      - name: Smoke-run the bundle (CLI --help)
        shell: bash
        run: |
          echo "Running ./dist/keycast${{ matrix.ext }} --help"
          "./dist/keycast${{ matrix.ext }}" --help
      - name: Upload freezer preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: keycast-freezer-${{ matrix.os }}-preview
          path: './dist/keycast${{ matrix.ext }}'
          retention-days: 7
  build-macos:
    # Build-only regression guard + preview: bundle keycast into a .app on every
    # PR/push so a dependency or Python bump that breaks PyInstaller bundling fails
    # HERE, against the offending diff, instead of during a release. The test suite
    # runs against the source tree and never against the frozen bundle, so this is
    # the only check that exercises packaging. The .app is wrapped in a .dmg and
    # uploaded as an unsigned, version-0.0.0 preview artifact (7-day retention) so a
    # reviewer can launch-test the overlay on a real Mac — the live path CI cannot
    # exercise. The .dmg wrapper is load-bearing: actions/upload-artifact re-zips
    # its input and drops the POSIX exec bit + symlinks a .app relies on, so a raw
    # .app would download "damaged"; the .dmg carries its own filesystem and
    # survives intact (same reason release.yml ships a .dmg). It is NOT the release
    # artifact; release.yml produces that.
    name: Build macOS app (check)
    if: ${{ github.event.pull_request.draft != true }}
    # Deliberately PINNED to match release.yml's build-macos (NOT `macos-latest`):
    # the build runner sets the bundle's minimum-macOS floor, so the PR check must
    # exercise the same OS the release artifact is built on, not silently follow the
    # `macos-latest` -> macOS 26 migration (runner-images#14167). The test matrix
    # above intentionally stays on `macos-latest`.
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # No fetch-depth: 0 — hatch-vcs falls back to 0.0.0 on a shallow checkout
        # (fallback-version in pyproject), which is fine for a build-only check.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          # cache-python: enable-cache only caches the uv package cache, NOT the
          # managed interpreter (a separate dir). Without this the ~30MB Astral
          # CPython below is re-downloaded every run.
          cache-python: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install Astral CPython 3.14.6
        # Pinned to a verified-good Astral build (see release.yml / ADR-001);
        # bump deliberately. 3.14.3 ships broken Tk.
        run: uv python install 3.14.6
      - name: Build the .app with PyInstaller
        run: |
          uv venv --python 3.14.6 .venv-pkg
          uv pip install --python .venv-pkg/bin/python . pyinstaller==6.16.0
          .venv-pkg/bin/pyinstaller --noconfirm packaging/keycast.spec
      - name: Verify the bundle is well-formed and contains Tk
        # Cheapest assertion that catches the silent "no Tk" failure without
        # launching a GUI: the bundle must have the launcher and the _tkinter
        # extension. A Tk-less bundle builds clean but crashes on a user's Mac.
        run: |
          test -x dist/keycast.app/Contents/MacOS/keycast
          find dist/keycast.app -name '_tkinter*.so' | grep -q . \
            || { echo "::error::_tkinter missing from the bundle"; exit 1; }
      - name: Package the .app into a .dmg
        # Wrap before upload so the bundle survives artifact zipping intact (see the
        # job comment) — mirrors release.yml's macOS packaging step.
        run: |
          hdiutil create -volname keycast \
            -srcfolder dist/keycast.app -ov -format UDZO keycast.dmg
      - name: Upload the .dmg as a preview build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: keycast-macos-preview
          path: keycast.dmg
          retention-days: 7
  build-windows:
    # Windows counterpart of build-macos: a build-only guard + preview for the
    # bundle that is otherwise unverified locally. Same single spec — PyInstaller's
    # macOS BUNDLE is a no-op off macOS, so the build yields dist/keycast/
    # (keycast.exe + deps). Uploads an unsigned, version-0.0.0 preview (7-day
    # retention); the release artifact comes from release.yml.
    name: Build Windows app (check)
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          # NB: no cache-python on Windows. uv creates a minor-version *junction*
          # (cpython-3.14-windows-... -> the patch dir) that GitHub's tar-based
          # cache cannot round-trip; a restored cache leaves a broken reparse point
          # and `uv python install` then fails with "directory name is invalid"
          # (os error 267). Re-downloading the ~30MB interpreter is the reliable
          # trade. macOS caches it fine (tar preserves symlinks there).
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install Astral CPython 3.14.6
        run: uv python install 3.14.6
      - name: Build the .exe with PyInstaller
        shell: pwsh
        run: |
          uv venv --python 3.14.6 .venv-pkg
          uv pip install --python .venv-pkg/Scripts/python.exe . pyinstaller==6.16.0
          .venv-pkg/Scripts/pyinstaller.exe --noconfirm packaging/keycast.spec
      - name: Verify the bundle is well-formed and contains Tk
        # Windows analogue of the macOS check: the folder must have the launcher
        # and the _tkinter extension (a .pyd on Windows). A Tk-less bundle builds
        # clean but crashes on launch.
        shell: pwsh
        run: |
          if (-not (Test-Path dist/keycast/keycast.exe)) {
            Write-Host "::error::keycast.exe missing from the bundle"; exit 1
          }
          if (-not (Get-ChildItem -Recurse dist/keycast -Filter '_tkinter*.pyd' -ErrorAction SilentlyContinue)) {
            Write-Host "::error::_tkinter missing from the bundle"; exit 1
          }
      - name: Compile the installer (Inno Setup)
        shell: pwsh
        # A broken keycast.iss would block the atomic release (release.yml's
        # publish-pypi needs build-windows), so compile it here on every PR.
        # iscc.exe ships in the windows-latest runner image (InnoSetup, verify on
        # the runner-image readme); if a future image drops it, add an install
        # step. No version flag here, so the script's 0.0.0 default is used.
        # Assert the installer actually emerged.
        run: |
          iscc packaging/keycast.iss
          if (-not (Test-Path packaging/keycast-setup.exe)) {
            Write-Host "::error::keycast-setup.exe missing after iscc"; exit 1
          }
      - name: Pack the MSIX (Microsoft Store)
        shell: pwsh
        # A broken AppxManifest.xml would block the atomic release exactly like
        # a broken keycast.iss, so pack it here on every PR with the template's
        # 0.0.0.0 default version (ADR-009). No -Version -> the manifest is
        # packed verbatim. Shared with release.yml via pack.ps1 so the makeappx
        # resolution and layout staging can't drift between the two.
        run: ./packaging/msix/pack.ps1
      - name: Upload the folder and installer as a preview build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: keycast-windows-preview
          path: |
            dist/keycast
            packaging/keycast-setup.exe
          retention-days: 7
  check:
    if: ${{ always() && github.event.pull_request.draft != true }}
    needs: [ci, hooks, style, docs-doctest, cli-installed, build-freezer-check, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
