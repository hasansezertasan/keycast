---
name: Release
on:
  # DO NOT REMOVE workflow_dispatch. It looks like a publish-escalation surface —
  # a manual run executes this file from the *selected branch*, so the
  # `release_created` guards are not a mitigation — but `finalize-release`
  # re-dispatches this workflow with `gh workflow run` to reconcile a phantom
  # release PR, and that API requires the trigger to exist. workflow_dispatch is
  # also the documented exception to GITHUB_TOKEN loop-prevention, which is why
  # that step needs no PAT. The containment is the `publish` environment's
  # deployment-branch policy, which GitHub evaluates OUTSIDE this file so a
  # branch edit cannot bypass it — see docs/maintaining/setup.rst
  # ("Restrict the publish environment to main"). Verify that policy is in
  # place rather than deleting this trigger.
  workflow_dispatch:
  push:
    branches:
      - main
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    name: Release Please
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write  # IMPORTANT: release-please manages PR labels via the Issues API
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # Prerelease detection (beta channel, see ADR-007). release-please tags
      # prereleases in SemVer form -- `v0.2.0-beta.1` -- which hatch-vcs
      # normalizes to the PEP 440 `0.2.0b1`. A final/graduated tag (`v0.2.0`)
      # never contains a hyphen, so a `-` in the tag is an unambiguous
      # prerelease marker. Downstream jobs gate on this: prereleases ship to
      # PyPI (hidden from `pip install` without `--pre`) and the GitHub
      # release, but are kept OFF the Homebrew/Scoop channels. Inert while the
      # beta channel stays disabled (no `-` tags), binding if re-enabled.
      is_prerelease: ${{ contains(steps.release.outputs.tag_name, '-') }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
  build:
    needs: release-please
    timeout-minutes: 15
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # This environment's external main-only deployment policy protects both
    # package publishing and attestation minting from branch dispatches.
    environment: publish
    env:
      ATTEST_BUILD_PROVENANCE: ${{ github.repository_visibility == 'public' || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
    permissions:
      attestations: write  # IMPORTANT: Publish Sigstore build provenance to GitHub
      contents: read  # IMPORTANT: actions/checkout needs read access to the repo
      id-token: write  # IMPORTANT: Mint the Sigstore signing certificate
    runs-on: ubuntu-latest
    name: Build the Package
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # hatch-vcs derives the version from the git tag, so fetch full history
          # and tags. `force-tag-creation` in the release-please config makes
          # release-please create the tag immediately — GitHub otherwise withholds
          # a draft release's tag until it is published, which would make hatch-vcs
          # stamp the previous version.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Restore cache
        if: steps.setup-uv.outputs.cache-hit == 'true'
        run: echo "Cache was restored"
      - name: Build the Package
        run: uv build --no-sources --quiet
      - name: Attest build provenance
        if: env.ATTEST_BUILD_PROVENANCE == 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Stage provenance bundle
        if: env.ATTEST_BUILD_PROVENANCE == 'true'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: cp "$BUNDLE_PATH" build-provenance.sigstore.json
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: package-distributions
          path: dist/
      - name: Upload provenance bundle
        if: env.ATTEST_BUILD_PROVENANCE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-provenance
          path: build-provenance.sigstore.json
  pypi-publish:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    timeout-minutes: 10
    # Atomic gate: requires ALL builders (wheel, freezer binaries, and the
    # desktop .dmg/.exe bundles below) plus the SBOM. A failed bundle or SBOM
    # blocks the PyPI release too — nothing ships unless every artifact built.
    # `sbom` is required here (not just in `attach-github-release` below)
    # because PyPI publication is irreversible: without this gate a failed SBOM
    # would leave a published version whose GitHub release stays a draft.
    needs: [release-please, build, build-freezer, build-macos, build-windows, sbom]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      id-token: write  # IMPORTANT: Mandatory for Trusted Publishing (gh-action-pypi-publish)
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment:
      name: publish
      url: https://pypi.org/project/keycast/${{ needs.release-please.outputs.version }}
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
  build-freezer:
    name: Build Freezer (PyInstaller)
    timeout-minutes: 20
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read  # IMPORTANT: actions/checkout needs read access to the repo
    strategy:
      fail-fast: false
      matrix:
        # label/ext make each binary's filename unique per OS (and per tool across
        # jobs), so download-artifact's merge-multiple and the release asset names
        # never collide. See https://hasansezertasan.github.io/copier-pyproject/context/standalone-executables/#executables-are-named-per-tool-and-os-and-all-target-the-package-main-module.
        include:
          - os: ubuntu-latest
            label: linux
            ext: ""
          - os: windows-latest
            label: windows
            ext: ".exe"
          - os: macos-latest
            label: macos
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Build with PyInstaller
        # The spec's static name="keycast" can't see the matrix, so
        # rename the built binary to a unique per-OS name afterwards (bash is used
        # for a portable mv across the Linux/macOS/Windows runners).
        shell: bash
        run: |
          uv run --locked --group tool pyinstaller keycast.spec --clean --noconfirm
          mv "dist/keycast${{ matrix.ext }}" "dist/keycast-freezer-${{ matrix.label }}${{ matrix.ext }}"
      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: keycast-executable-freezer-${{ matrix.os }}
          path: './dist/keycast-freezer-${{ matrix.label }}${{ matrix.ext }}'
  # Full desktop bundles, built on top of the template's freezer job above: the
  # freezer produces single-file binaries, while these jobs wrap the committed
  # `packaging/keycast.spec` onedir bundle into the shippable macOS .dmg and
  # Windows .zip + installer that the Homebrew cask / Scoop bucket consume.
  build-macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # Apple Silicon runner: Astral's standalone CPython is single-arch, so an
    # arm64 runner yields an arm64-only .app (see packaging/keycast.spec).
    # Deliberately PINNED, not `macos-latest`: the build runner sets the released
    # bundle's effective minimum-macOS floor, so it must not silently follow the
    # `macos-latest` -> macOS 26 migration (runner-images#14167). Bump this pin
    # consciously when raising the supported-OS floor.
    runs-on: macos-26
    name: Build macOS app
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # hatch-vcs needs the tag for __version__ (`uv pip install .` builds it).
          fetch-depth: 0
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          # cache-python: enable-cache only caches the uv package cache, NOT the
          # managed interpreter. Without this the ~30MB Astral CPython below is
          # re-downloaded every release run.
          cache-python: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install Astral CPython 3.14.6
        # Pinned to a verified-good Astral build (see docs/adr/001), not the
        # proven minimum: 3.14.6 ships working Tk 9.0. Astral 3.14.3 tested broken
        # (Tcl init fails) and Homebrew python@3.14 has no _tkinter, so bump this
        # deliberately — an unpinned Python could silently produce a Tk-less or
        # crashing bundle.
        run: uv python install 3.14.6
      - name: Build the .app with PyInstaller
        # pyinstaller pinned to match the release workflow's known-good version.
        run: |
          uv venv --python 3.14.6 .venv-pkg
          uv pip install --python .venv-pkg/bin/python . pyinstaller==6.16.0
          .venv-pkg/bin/pyinstaller --noconfirm packaging/keycast.spec
      - name: Package the .app into a .dmg
        # dmgbuild writes the Finder layout (.DS_Store) directly, so the
        # drag-to-Applications styling is produced headlessly — no Finder /
        # AppleScript, unlike create-dmg. Layout lives in packaging/dmg_settings.py.
        run: |
          uvx dmgbuild -s packaging/dmg_settings.py -D app=dist/keycast.app \
            keycast keycast.dmg
          echo "sha256 (for the Homebrew cask):"
          shasum -a 256 keycast.dmg
      - name: Upload the .dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-macos
          path: keycast.dmg
  build-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # NOTE: developed on a macOS dev machine and never built locally; the Windows
    # bundle is exercised by the build-only `build-windows` check in ci.yml.
    # Reuses the committed spec — PyInstaller's macOS BUNDLE step is a no-op on
    # Windows, so the spec yields the dist/keycast/ folder (keycast.exe + deps),
    # which is zipped for a direct GitHub-release download.
    runs-on: windows-latest
    name: Build Windows app
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          # NB: no cache-python on Windows. uv creates a minor-version *junction*
          # (cpython-3.14-windows-... -> the patch dir) that GitHub's tar-based
          # cache cannot round-trip; a restored cache leaves a broken reparse point
          # and `uv python install` then fails with "directory name is invalid"
          # (os error 267). Re-downloading the ~30MB interpreter is the reliable
          # trade. macOS caches it fine (tar preserves symlinks there).
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install Astral CPython 3.14.6
        run: uv python install 3.14.6
      - name: Build the .exe with PyInstaller
        shell: pwsh
        run: |
          uv venv --python 3.14.6 .venv-pkg
          uv pip install --python .venv-pkg/Scripts/python.exe . pyinstaller==6.16.0
          .venv-pkg/Scripts/pyinstaller.exe --noconfirm packaging/keycast.spec
      - name: Package the app folder into a .zip
        shell: pwsh
        run: Compress-Archive -Path dist/keycast -DestinationPath keycast-windows.zip
      - name: Build the installer (Inno Setup)
        shell: pwsh
        # iscc.exe ships in the windows-latest runner image (if a future image
        # drops InnoSetup, add an install step here). Inject the release
        # version (the tag is the single source of truth, like hatch-vcs) so the
        # installer's version matches the bundled __version__. Both
        # keycast-setup.exe and keycast-windows.zip ship as assets — the installer
        # for normal users, the zip as the portable / no-admin option.
        # The version travels via env, never interpolated into the run block
        # (zizmor template-injection audit).
        env:
          APP_VERSION: ${{ needs.release-please.outputs.version }}
        run: iscc /DMyAppVersion=$env:APP_VERSION packaging/keycast.iss
      - name: Upload the .zip and the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-windows
          path: |
            keycast-windows.zip
            packaging/keycast-setup.exe
      - name: Pack the MSIX (Microsoft Store submission artifact)
        # Skipped for prereleases: MSIX versions are four-part numeric with no
        # prerelease form, and the Store is a stable-only channel (ADR-007 /
        # ADR-009) — the guard is inert while the beta channel is disabled, but
        # binding if it is re-enabled.
        if: ${{ needs.release-please.outputs.is_prerelease != 'true' }}
        shell: pwsh
        # The Store signs and hosts the package (ADR-009), so keycast.msix is a
        # *workflow artifact* for Partner Center — deliberately NOT a release
        # asset: an unsigned MSIX cannot be installed, so attaching it would
        # publish a file users can't use (attach-github-release only collects
        # dist-* artifacts for the same reason). Shared with ci.yml via pack.ps1
        # (makeappx resolution + layout staging live there so they can't drift).
        # -Version rewrites the manifest's Identity Version from the tag:
        # vX.Y.Z -> X.Y.Z.0 (the tag exists at build time thanks to
        # release-please's force-tag-creation, the same guarantee hatch-vcs
        # relies on). The version travels via env, never interpolated into the
        # run block (zizmor template-injection audit).
        env:
          APP_VERSION: ${{ needs.release-please.outputs.version }}
        run: ./packaging/msix/pack.ps1 -Version $env:APP_VERSION
      - name: Upload the MSIX (not a dist-* name — stays off the release)
        if: ${{ needs.release-please.outputs.is_prerelease != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: keycast-msix
          path: keycast.msix
  sbom:
    name: Generate SBOM (CycloneDX)
    timeout-minutes: 10
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read  # IMPORTANT: actions/checkout needs read access to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Export locked runtime dependencies
        # SBOM describes what ships: the resolved runtime tree, excluding dev
        # tooling and the project. Component/settings deps are core
        # `dependencies`, so a plain export already covers them; `--all-extras`
        # is retained as a harmless safeguard should a future extra ship deps.
        run: uv export --frozen --all-extras --no-dev --no-emit-project --format requirements.txt --output-file requirements-sbom.txt
      - name: Generate CycloneDX SBOM
        run: uvx --from cyclonedx-bom cyclonedx-py requirements requirements-sbom.txt --output-format JSON --output-file keycast-sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: keycast-sbom
          path: keycast-sbom.cdx.json
  attach-github-release:
    runs-on: ubuntu-latest
    name: Attach Build Artifacts to GitHub Release
    timeout-minutes: 10
    needs: [release-please, pypi-publish, sbom, build-freezer, build-macos, build-windows]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write  # IMPORTANT: Mandatory for GitHub Release
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: package-distributions
          path: dist/
      - name: Download executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: keycast-executable-*
          path: dist/executables/
          merge-multiple: true
      - name: Download desktop bundles
        # The macOS .dmg and Windows .zip + installer from the custom builders
        # above (the Homebrew cask and Scoop bucket consume these).
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Download SBOM
        # Lands in dist/ so the CycloneDX SBOM is attached to the release
        # alongside the distributions by the upload step below.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: keycast-sbom
          path: dist/
      - name: Download provenance bundles
        if: ${{ github.repository_visibility == 'public' || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: build-provenance*
          path: dist/provenance/
          merge-multiple: true
      - name: Attach Build Artifacts to the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass GitHub context through env, never interpolated into the shell.
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Upload every file under dist/ (executables land in dist/executables/, so a
          # plain ./dist/* glob would pass that subdirectory to gh, which rejects dirs).
          # Guard the empty case first: `xargs` with no input never invokes gh and
          # exits 0, which would silently publish a release with zero assets attached.
          test "$(find dist -type f | wc -l)" -gt 0 \
            || { echo "::error::no artifacts found under dist/ to attach to the release"; exit 1; }
          find dist -type f -print0 | xargs -0 gh release upload "$TAG_NAME" --clobber --repo "$REPO"
  finalize-release:
    runs-on: ubuntu-latest
    name: Publish the GitHub Release
    timeout-minutes: 10
    needs: [release-please, pypi-publish, attach-github-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write  # IMPORTANT: Mandatory to un-draft the GitHub Release
      pull-requests: write  # IMPORTANT: Mandatory to close the phantom release PR
      actions: write  # IMPORTANT: Mandatory to re-dispatch this workflow
    steps:
      - name: Publish the draft release
        # KNOWN COSMETIC LIMITATION (accepted, see https://hasansezertasan.github.io/copier-pyproject/context/release-automation/#the-stale-draft-release-comment-link-is-an-accepted-cosmetic-defect): while the release is
        # a draft it has no public tag page, so its URL is a transient
        # `/releases/tag/untagged-<hash>` slug. release-please writes its
        # "🤖 Created releases:" comment on the merged release PR once, at
        # draft-creation time, capturing that slug — and never rewrites it. When
        # this step un-drafts the release GitHub moves it to
        # `/releases/tag/<TAG_NAME>` and the `untagged-…` link 404s. This is a
        # dead link on an already-merged PR, not a broken release: the release,
        # its tag, artifacts, and SBOM are all correct. Left as-is on purpose —
        # `draft: false` would fix the link but reintroduce a window where a
        # public release exists with no artifacts/SBOM attached (a worse trade).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ needs.release-please.outputs.is_prerelease }}
        run: |
          # Un-draft, and set the prerelease/latest flags explicitly. A beta is
          # marked --prerelease and kept OFF "Latest release" so it never displaces
          # the newest stable on the repo home; a graduated stable forces the
          # inverse. Inert while the beta channel stays disabled (ADR-007).
          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release edit "$TAG_NAME" --draft=false --prerelease --latest=false --repo "$REPO"
          else
            gh release edit "$TAG_NAME" --draft=false --prerelease=false --latest --repo "$REPO"
          fi
      - name: Reconcile the next release PR against the now-published release
        # release-please derives its commit range from the latest *published*
        # GitHub Release and ignores drafts. The release-please job above may have
        # opened the next release PR in this same run while this release was still
        # a draft, so that PR was computed with no baseline and re-lists shipped
        # commits as a phantom bump. release-please will NOT self-heal: a later
        # run with no new commits just skips, leaving the orphan PR open. So close
        # it now that the release is published, then re-dispatch. The re-dispatch
        # sees the published release and recreates a CORRECT next PR only if real
        # unreleased commits exist; otherwise it stops without reaching this job,
        # so the re-trigger is bounded to one run. (workflow_dispatch is the
        # documented exception to GITHUB_TOKEN loop-prevention, so no PAT needed.)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub-context values are read through env and referenced as shell
          # vars rather than interpolated inline, per the repo's no-untrusted-
          # context-in-run convention (this also satisfies zizmor's
          # template-injection audit). This workflow runs only on push to main /
          # workflow_dispatch, so these values are not fork-controlled here; the
          # indirection is kept as uniform hygiene.
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          pr="$(gh pr list --state open \
            --repo "$REPO" \
            --head "release-please--branches--$REF_NAME" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            echo "Closing phantom release PR #$pr"
            gh pr close "$pr" --delete-branch --repo "$REPO"
          fi
          gh workflow run "$WORKFLOW" --ref "$REF_NAME" --repo "$REPO"
  bump-homebrew:
    name: Bump Homebrew cask
    needs: [release-please, finalize-release]
    # Stable releases only: a beta must never reach Homebrew users (brew has no
    # `--pre` equivalent to PyPI's, so a bumped cask would push the beta to
    # everyone). Prereleases stop at PyPI + the GitHub release. Inert while the
    # beta channel stays disabled (ADR-007).
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.is_prerelease != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Dispatch the tap update
        env:
          # PAT with Contents: write on the tap repo (NOT the repo GITHUB_TOKEN,
          # which cannot POST a cross-repo dispatch). Absent → skip, never fail.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; skipping Homebrew bump"
            exit 0
          fi
          echo "Dispatching update-cask for keycast $VERSION"
          gh api repos/hasansezertasan/homebrew-tap/dispatches \
            --method POST \
            -f event_type=update-cask \
            -f 'client_payload[cask]=keycast' \
            -f "client_payload[version]=$VERSION"
  bump-scoop:
    name: Bump Scoop bucket
    needs: [release-please, finalize-release]
    # Stable releases only (mirrors bump-homebrew): Scoop has no prerelease
    # channel, so a beta would land in every bucket user's `scoop update`.
    # Inert while the beta channel stays disabled (ADR-007).
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.is_prerelease != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Dispatch the bucket update
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::SCOOP_BUCKET_TOKEN not set; skipping Scoop bump"
            exit 0
          fi
          echo "Dispatching update-manifest for keycast $VERSION"
          gh api repos/hasansezertasan/scoop-bucket/dispatches \
            --method POST \
            -f event_type=update-manifest \
            -f 'client_payload[package]=keycast' \
            -f "client_payload[version]=$VERSION"
  deploy-docs:
    runs-on: ubuntu-latest
    name: Deploy Docs
    timeout-minutes: 15
    # Deploy docs inline after the release is published. The `release: published`
    # event that finalize-release emits cannot trigger a separate workflow,
    # because events fired by the GITHUB_TOKEN do not start new workflow runs
    # (the workflow_dispatch exception is why finalize-release re-dispatches
    # itself above). So docs deployment must live in this workflow as a job.
    needs: [release-please, finalize-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.is_prerelease != 'true' }}
    # Kept OFF the docs site for prereleases: under minor/major granularity a
    # beta (e.g. 0.3.0-beta.1) collapses to its stable-looking slug (0.3),
    # which pick_latest() would treat as stable and assemble_site() would
    # publish over the graduated docs and the `latest` alias. Same
    # inert-while-disabled posture as the MSIX/Homebrew/Scoop prerelease
    # guards (ADR-007) — binding if the beta channel is ever enabled.
    # Graduating to stable rebuilds and publishes the docs then.
    permissions:
      contents: write  # IMPORTANT: Mandatory for GitHub Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Restore cache
        if: steps.setup-uv.outputs.cache-hit == 'true'
        run: echo "Cache was restored"
      - name: Set reproducible build epoch
        # Pin Sphinx's "today"/copyright to the last commit date so the same
        # commit always renders the same docs output (reproducible-builds.org).
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Install headless X server (Linux)
        # Sphinx autodoc imports keycast, whose listeners pull in pynput's X
        # backend at import time (same reason as the CI docs-doctest job).
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Fetch gh-pages branch
        # build_docs.py preserves already-published versions from gh-pages; make
        # the branch available locally (no-op on the very first release).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # actions/checkout runs with `persist-credentials: false` (artipacked),
        # so raw git has no credentials: on a PRIVATE repo an unauthenticated
        # `ls-remote`/`fetch` fails outright. Pass the token per invocation via
        # an in-memory http.extraheader — the same header actions/checkout uses
        # internally — so nothing is written to .git/config for a later step (or
        # an uploaded artifact) to pick up.
        #
        # `git fetch ... || echo` would swallow a transport error as if the branch
        # were simply absent: build_docs.py would then assemble a site with no
        # prior versions and the deploy below (clean, minus pr-preview/**) would
        # DELETE every published version directory from gh-pages. ls-remote can
        # tell the two apart — exit 2 is "no such ref", anything else is a real
        # failure worth aborting on.
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          set +e
          git -c "http.https://github.com/.extraheader=$auth" \
            ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            git -c "http.https://github.com/.extraheader=$auth" \
              fetch origin gh-pages:gh-pages
          elif [ "$rc" -eq 2 ]; then
            echo "gh-pages does not exist yet — first release, nothing to preserve"
          else
            echo "::error::could not query origin for gh-pages (ls-remote exit $rc); refusing to continue and risk deleting published versions"
            exit 1
          fi
      - name: Build versioned docs
        env:
          PYTHONUNBUFFERED: "1"
          # Passed via env (not interpolated into run:) — read by the Python
          # process, so no template-injection surface. See https://hasansezertasan.github.io/copier-pyproject/context/docs-versioning/#docs-publish-only-the-current-version-and-carry-older-built-versions-forward-from-gh-pages / CLAUDE.md.
          DOCS_BUILD_VERSION: ${{ needs.release-please.outputs.version }}
        # Builds only this release's docs, then assembles ./site with every prior
        # version copied from gh-pages, a `latest` alias, and a root redirect.
        run: xvfb-run -a uv run --no-default-groups --group docs python tools/build_docs.py site
      - name: Deploy to GitHub Pages
        # Publishes the assembled ./site to gh-pages. The action does its own git
        # auth from the token input (default github.token) without writing it to
        # .git/config, so the checkout above keeps persist-credentials: false.
        # sphinx.ext.githubpages emits .nojekyll so _static/ is served.
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445  # v4.9.0
        with:
          folder: site
          # Preserve the PR preview tree (pr-preview/**) that docs-preview.yml
          # maintains — the action's default clean: true would otherwise wipe it.
          # The numeric version directories (e.g. 0.3/) are re-supplied in ./site
          # each run, so clean is safe for them. Disable force-push so a
          # concurrent preview deploy is not clobbered. See https://hasansezertasan.github.io/copier-pyproject/context/docs-stack/#pr-docs-previews-deploy-to-a-subfolder-of-the-projects-own-gh-pages-same-repo-only, https://hasansezertasan.github.io/copier-pyproject/context/docs-versioning/#docs-publish-only-the-current-version-and-carry-older-built-versions-forward-from-gh-pages.
          clean-exclude: pr-preview/**
          force: false
  notify-released-issues:
    runs-on: ubuntu-latest
    name: Notify released issues
    timeout-minutes: 10
    # Runs after the release is published (un-drafted) so the comment links a
    # live release page. Best-effort: a failure here never affects the already
    # published release or packages. See https://hasansezertasan.github.io/copier-pyproject/context/release-automation/#released-issue-notifications-are-one-inline-job-in-releaseyml.
    needs: [release-please, finalize-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      issues: write  # IMPORTANT: comment on the issues this release closed
      contents: read  # IMPORTANT: read commits to map the release to issues
      pull-requests: read  # IMPORTANT: listPullRequestsAssociatedWithCommit needs this
    steps:
      - name: Comment on issues closed by this release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          # GitHub-context values pass through env, never interpolated into the
          # script body (read via process.env) — the repo's no-untrusted-context
          # convention and zizmor's template-injection audit. These come from the
          # release-please outputs on a push-to-main run, so they are not
          # fork-controlled; the indirection is uniform hygiene.
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const version = process.env.VERSION;
            const { owner, repo } = context.repo;

            // The previous published release delimits this release's commit range.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const previous = releases.find((r) => !r.draft && r.tag_name !== tag);
            if (!previous) {
              core.info("No previous release found; nothing to notify.");
              return;
            }

            // Commits in (previous, this] release, then the PRs that carried them.
            // Paginate explicitly: the compare endpoint caps at 250 commits per
            // page, so a large release would otherwise silently miss the tail. The
            // iterator reads each page's `data.commits` (unambiguous, unlike
            // relying on paginate() to normalize the compare response shape).
            const prNumbers = new Set();
            const pages = github.paginate.iterator(github.rest.repos.compareCommitsWithBasehead, {
              owner, repo, basehead: `${previous.tag_name}...${tag}`, per_page: 100,
            });
            for await (const { data } of pages) {
              for (const commit of data.commits || []) {
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: commit.sha,
                });
                for (const pr of prs) prNumbers.add(pr.number);
              }
            }

            // The issues each PR declared it closes (the real Development link,
            // not just body text).
            const issues = new Set();
            const query = "query ($owner: String!, $repo: String!, $pr: Int!) { repository(owner: $owner, name: $repo) { pullRequest(number: $pr) { closingIssuesReferences(first: 50) { nodes { number } } } } }";
            for (const pr of prNumbers) {
              const result = await github.graphql(query, { owner, repo, pr });
              const nodes = result.repository.pullRequest?.closingIssuesReferences?.nodes || [];
              for (const node of nodes) issues.add(node.number);
            }
            if (issues.size === 0) {
              core.info("No closed issues linked to this release.");
              return;
            }

            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const body = `🎉 This was addressed in [\`${version}\`](${release.html_url}), which has just been released.`;
            for (const number of issues) {
              try {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
                core.info(`Commented on #${number}`);
              } catch (error) {
                core.warning(`Could not comment on #${number}: ${error.message}`);
              }
            }
