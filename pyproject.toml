[project]
name = "keycast"
description = "Keycast is a cross-platform keystroke and mouse click visualizer built in Python."
license = "MIT"
readme = "README.md"
authors = [
  { name = "Hasan Sezer Taşan", email = "hasansezertasan@gmail.com" },
]
maintainers = [
  { name = "Hasan Sezer Taşan", email = "hasansezertasan@gmail.com" },
]
dynamic = ["version"]
# Keycast is a desktop overlay + CLI for presenters (not a generic scaffold):
# keywords describe the project, not the tooling that builds it.
keywords = [
  "keystrokes",
  "mouse",
  "visualizer",
  "screencast",
  "overlay",
  "presenter",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Multimedia :: Graphics :: Presentation",
  "Topic :: Utilities",
  "Typing :: Typed",
]
# Keycast needs Python 3.14 (Tk 9 via the Astral builds pinned in the release
# workflow; 3.14.3 ships broken Tk, see docs/adr/001). The template default
# (>=3.10 with a 3.10-3.14 CI sweep) does not apply: only the 3.14 tox env and
# type-checker pins below are meaningful here.
requires-python = ">=3.14"
# Runtime deps are exact-pinned (uv add-bounds = "exact" below): the overlay,
# its settings validation, and the frozen bundles must resolve identically
# everywhere, including the PyInstaller release jobs.
dependencies = [
  "packaging==26.3",
  "pydantic==2.13.5",
  "pydantic-core==2.46.5",
  "pydantic-extra-types==2.11.1",
  "pydantic-settings==2.15.0",
  "pynput==1.8.2",
  "typer==0.27.2",
]

[project.urls]
changelog = "https://github.com/hasansezertasan/keycast/blob/main/CHANGELOG.md"
documentation = "https://hasansezertasan.github.io/keycast"
homepage = "https://github.com/hasansezertasan/keycast"
issues = "https://github.com/hasansezertasan/keycast/issues"
releasenotes = "https://github.com/hasansezertasan/keycast/releases"
source = "https://github.com/hasansezertasan/keycast.git"

[project.scripts]
# Single coherent entry point: `keycast` launches the overlay, while
# `keycast version` / `keycast info` expose the CLI subcommands.
keycast = "keycast.cli:app"


[dependency-groups]
dev = [
  "tox==4.64.10",
  "tox-uv==1.36.1",
  "debugpy==1.8.22",
  { include-group = "style" },
  { include-group = "test" },
]
style = [
  "basedpyright==1.40.2",
  "detect-secrets==1.5.0",
  "editorconfig-checker==3.8.0",
  "import-linter==2.15",
  "mypy==2.4.0",
  "pylint==4.0.6",
  "pyrefly==1.2.0",
  "ruff==0.17.0",
  "slotscheck==0.21.0",
  "sphinx-lint==1.0.2",
  "taplo==0.9.3",
  "ty==0.0.66",
  "typos==1.49.0",
  # Stubs for the untyped pynput dependency: without them every checker sees
  # `keyboard`/`mouse` (and `Key.name`, `KeyCode.char`, ...) as Any, which fails
  # strict `no-any-return` and unknown-import gates. Single version source here.
  "types-pynput==1.8.1.20260712",
  "zuban==0.9.1",
]
# semgrep is deliberately its own group rather than part of `style`: `dev`
# includes `style` wholesale, so a plain `uv sync` — and every Windows/macOS
# cell in ci.yml, which runs `uv run --locked tox run` — would download and
# unpack ~215 MB (the wheel bundles a native semgrep-core) for a tool that only
# ever executes in the Linux-only `style` job. The tox `style` env lists this
# group explicitly. Still a single version source, same as every other pin.
sast = [
  "semgrep==1.180.0",
]
# Dependency hygiene gets its own group for the same reason `sast` does: it is
# only ever run by the on-demand `deps` tox env and the `deps` CI job, so a plain
# `uv sync` should not install it. deptry checks the imports against the declared
# dependencies (missing, transitive, misplaced or obsolete); creosote flags
# declared runtime dependencies that nothing imports.
deps = [
  "creosote==5.2.0",
  "deptry==0.25.1",
]
test = [
  "coverage-enable-subprocess==1.0",
  "coverage[toml]==7.16.2",
  "pytest-mock==3.16.0",
  "pytest-rerunfailures==16.7",
  "pytest-xdist[psutil]==3.8.0",
  "pytest==9.1.1",
  "pytest-sugar",
  "dirty-equals",
  "inline-snapshot",
  "pytest-deadfixtures==3.1.0",
]
docs = [
  "sphinx==8.1.3",
  "shibuya==2026.7.12",
  "sphinx-autobuild==2024.10.3", # 2025.x drops Python 3.10 (requires-python >= 3.11)
  "sphinx-copybutton==0.5.2",
  "sphinx-design==0.6.1", # 0.7.0 drops Python 3.10 (requires-python >= 3.11)
  "sphinx-togglebutton==0.4.5",
  "sphinx-paramlinks==0.6.0",
  "auto-pytabs[sphinx]==0.5.0",
  "myst-parser==4.0.1",
  # Per-page "last updated" footer sourced from git commit dates;
  # offline, no network. Works from full history (docs CI checks out depth 0).
  "sphinx-last-updated-by-git==0.3.8",
  # PEP 440 version parsing/sorting used by tools/build_docs.py to order
  # published versions and pick the `latest` alias. Also a Sphinx
  # transitive dependency; pinned here for the explicit direct use.
  "packaging>=24.0",
  # Renders the Configuration reference (docs/configuration.rst) directly from
  # the live ``settings`` Settings model so documented fields/types/
  # defaults never drift from the source.
  "autodoc-pydantic==2.2.0",
]
tool = [
  "commitizen==4.17.0",
  "pyinstaller>=6.0.0",
  # "marimo==0.15.2",
  # "inflection==0.5.1",
]
prek = [
  "prek==0.4.12",
]


[build-system]

requires = ["hatchling", "hatch-vcs"]

build-backend = "hatchling.build"


[tool.uv]
add-bounds = "exact"
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]
package = true
trusted-publishing = "always"


[tool.hatch.version]
source = "vcs"
# Last-resort sentinel: only used when a build sees neither a .git directory nor
# an expanded .git_archival.txt (e.g. an archive of a commit with no reachable
# tag). "0.0.0" reads clearly as "version could not be determined" rather than
# masquerading as a real early release. See .git_archival.txt + .gitattributes
# `export-subst` for the archive path that recovers the real tag-derived version.
fallback-version = "0.0.0"


[tool.hatch.build]
hooks.vcs.version-file = "src/keycast/_version.py"


[tool.hatch.version.raw-options]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.sdist]
# The package uses a src layout, so the source tree lives under /src (not
# /keycast); including /src ships the actual modules -- and, for
# C-extension projects, the .pyx/.pxd sources needed to compile from the sdist.
include = [
  "/README.md",
  "LICENSE",
  "/src",
  "/tests",
  "/docs/examples",
]


[tool.commitizen]
# Commit-authoring and message linting only. release-please owns version
# bumping, git tagging, and CHANGELOG.md (see .github/release-please-config.json),
# so the bump/tag/changelog settings are intentionally omitted here to avoid two
# tools competing over the same tags and changelog file.
name = "cz_conventional_commits"

[tool.pytest.ini_options]
# addopts = "-rXs --strict-config --strict-markers"
addopts = "-v --tb=short --doctest-glob=README.md"
# One marker per component, auto-applied by tests/conftest.py from each test's
# top-level tests/<dir>/. Enables `pytest -m web` locally and per-component CI
# jobs; `integration` is one axis of the scheme.
markers = [
  "core: core/shared component tests",
  "cli: CLI component tests",
  "gui: GUI component tests",
]
filterwarnings = [
  "error",
]
# The project README is the deliberately small Markdown doctest surface. Other
# Markdown files can use illustrative snippets without becoming pytest inputs.
testpaths = ["tests", "README.md"]
doctest_optionflags = "ELLIPSIS IGNORE_EXCEPTION_DETAIL NORMALIZE_WHITESPACE"
xfail_strict = true


[tool.coverage.run]
branch = true
# Match `_version.py` wherever it resolves: `src/...` in editable dev installs and
# `.../site-packages/...` when tox/CI installs the built (non-editable) wheel. A
# `src/**`-only pattern silently misses the installed copy and reports it at 0%.
# `__main__.py` is an entry-point shim exercised by running the module, not the suite.
omit = ["*/_version.py", "*/__main__.py"]
parallel = true
# Store data-file paths relative to the project root so `.coverage` files produced
# on different runners/OSes merge in the `coverage-combine` CI job without
# absolute-path mismatches. Complements the `[tool.coverage.paths]` remap below
# (which unifies the src/ vs site-packages layouts).
relative_files = true
source_pkgs = ["keycast", "tests"]


[tool.coverage.paths]
# Unify coverage data across environments. tox installs the built wheel into
# each env's site-packages, so the same source file is measured under a different
# `.tox/<env>/.../site-packages/keycast` path per interpreter. Without
# remapping those back to the canonical `src/` tree, `coverage combine` keeps a
# separate copy per env and a version-gated line covered in one interpreter but not
# another is wrongly counted as missed — silently failing the `fail_under` gate.
# `tests` needs no remapping: it is never installed, so every environment measures
# it at the same repo-local path.
keycast = ["src/keycast", "*/site-packages/keycast"]


[tool.coverage.report]
# Untestable code is excluded per site with `# pragma: no cover`, not with blanket
# patterns here: a regex matching a `def` line excludes the *whole function body*,
# so a pattern like `def main\(` would silently un-measure any future `main()`
# with real logic (and did mask the tested GUI/TUI entrypoints). Pragmas carry the
# exclusion decision next to the code it affects.
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
fail_under = 99
# Patterns match both the `src/` (editable) and installed (`site-packages`)
# layouts (see [tool.coverage.run] omit).
omit = ["*/_version.py", "*/__main__.py"]
show_missing = true
skip_covered = true


[tool.vulture]
# Framework-invoked handlers: Typer commands and pydantic validators are called
# by their frameworks, not by our code, so vulture cannot see the call sites.
# Suppress by decorator (precise) rather than naming each validator.
ignore_decorators = [
  "@app.command",
  "@field_validator",
  "@model_validator",
  # pytest invokes fixtures by the framework; an autouse fixture used only for
  # its side effect has no call site vulture can see.
  "@pytest.fixture",
]
# Names that are intentionally unused but required by a framework/library
# signature, so vulture cannot see why they exist.
ignore_names = [
  # pydantic protocol hooks: required positional/keyword names we don't consume
  "source", # __get_pydantic_core_schema__(cls, source, handler)
  "settings_customise_sources",
  "init_settings", # settings_customise_sources(...): keycast loads JSON only
  "env_settings",
  "dotenv_settings",
  "file_secret_settings",
  # unittest.mock attributes assigned in tests
  "side_effect",
  "__str__",
  # params of local monkeypatch stub functions, kept for signature parity
  "target",
  "src",
  "dst",
]
min_confidence = 60
paths = ["src", "tests"] # add "examples" here if/when that directory exists


[tool.deptry]
# `known_first_party` is explicit because the tox `deps` env installs the built
# wheel, so without it deptry reads the project's own imports as a third-party
# transitive dependency (DEP003). Add further `per_rule_ignores` entries for the
# project's own findings, e.g. DEP003 for a package only importable through
# another declared one, or DEP002 for an optional import guarded by try/except.
# See https://deptry.com/rules-violations/.
# Excluded: the Sphinx config, the build hook (its imports belong to
# `[build-system].requires`, not the runtime dependencies), the benchmarks and the
# worker probe script (neither ships in the wheel; pytest and anyio come from
# the dev tooling). The packaging artwork scripts are likewise excluded: they
# never ship in the wheel and provision Pillow per invocation
# (`uv run --with pillow ...`), so PIL is deliberately not a project dependency.
extend_exclude = [
  "docs/conf.py",
  "packaging/make_dmg_background.py",
  "packaging/make_icons.py",
]
known_first_party = ["keycast"]

[tool.deptry.per_rule_ignores]
# tools/build_docs.py imports `packaging`, pinned in the `docs` group for that
# script alone, so deptry reads it as a misplaced dev dependency.
DEP004 = ["packaging"]


[tool.slotscheck]
strict-imports = false


