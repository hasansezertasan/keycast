[tool.ruff]
fix = true
output-format = "full"
preview = true
show-fixes = true
src = ["src", "tests"]
target-version = "py314"
unsafe-fixes = true


[tool.ruff.analyze]
detect-string-imports = true
preview = true


[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true
skip-magic-trailing-comma = true


[tool.ruff.lint]
fixable = ["ALL"]
# Two opinionated ruff 0.16 preview rules are disabled: RUF105 would rewrite the
# portable `# noqa` comments into ruff's own `# ruff: ignore` syntax (its docs note
# `# noqa` is needed for cross-tool compatibility), and RUF201 would rewrite every
# rule *code* in this config's selectors into long rule *names*. Both are stylistic.
# pytest-fixture-autouse (new in ruff 0.17, still codeless so it cannot take a
# targeted noqa) is disabled repo-wide: the two autouse fixtures (the CLI
# update-check stub, the secure-input probe-cache reset) are documented
# per-module test hygiene, not hidden conftest side effects; threading them
# through every test signature would be noise.
ignore = ["COM812", "CPY", "FIX", "RUF105", "RUF201", "TD", "pytest-fixture-autouse"]
logger-objects = ["logging_setup.logger"]
preview = true
select = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
# skip-magic-trailing-comma = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-copyright]
author = "Hasan Sezer Taşan <hasansezertasan@gmail.com>"


[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates annotations at runtime, so imports used only in model
# field annotations (e.g. `pathlib.Path`) must NOT be moved into a
# `TYPE_CHECKING` block — doing so breaks model construction.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "pydantic_settings.BaseSettings",
]


[tool.ruff.lint.mccabe]
max-complexity = 5


[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true


[tool.ruff.lint.pydocstyle]
convention = "pep257"


[tool.ruff.lint.per-file-ignores]
# Tests are specification, not product: they group cases in classes whose
# methods take fixtures instead of `self` (PLR6301), reach into package
# internals white-box style (SLF001), use asserts/magic values, and skip
# docstring/return-value ceremony (D, DOC201, PLC2701, PLR2004, S101).
# Test doubles keep framework signatures (unused args are parity, not waste)
# and import lazily to simulate missing modules (ARG, PLC0415). They raise
# stdlib errors with descriptive messages to simulate real failures (TRY003),
# group many cases per class (PLR0904), and branch through realistic scenarios
# (C901) — restructuring them would churn the suite without changing behavior.
"tests/**/*.py" = ["D", "DOC201", "S101", "PLR2004", "PLC2701", "PLR6301", "SLF001", "ARG", "PLC0415", "TRY003", "C901", "PLR0904"]
# cli.py imports lazily on purpose: `version`/`info` stay instant and never pay
# for tkinter/pynput, and the GUI launch defers failing imports to an actionable
# error path (see the comments at each import).
"src/keycast/cli.py" = ["PLC0415"]
# The Sphinx config is a standalone module, not part of an importable package.
"docs/conf.py" = ["INP001"]
# The docs warning-allowlist gate is a standalone script (not an importable
# package) whose whole job is to print GitHub `::error::` annotations to stdout.
"docs/check_warnings.py" = ["INP001", "T201"]
# Build-time asset scripts (icon/dmg generation): developer tooling run by hand
# on macOS, not the shipped product. They print progress to stdout (T201),
# shell out to fixed local tools (S404/S603/S607), and live outside any package
# (INP001 — dmgbuild loads its settings file by path, not import).
"packaging/*.py" = ["T201", "S404", "S603", "S607", "INP001"]
# The versioned-docs build orchestrator is a standalone CLI script under tools/,
# not part of an importable package.
"tools/build_docs.py" = ["INP001"]
# settings.py deliberately prints to stderr (never the overlay/log) when the
# config file cannot even be read: logging is not configured yet at that point.
# Its pydantic field annotations are runtime-evaluated, so typing-only imports
# used there must stay at module scope; `__get_pydantic_core_schema__` is a real
# pydantic hook, not a bad dunder name. Settings-load handlers share the
# degrade-gracefully policy (a corrupt config recovers, never crashes).
"src/keycast/settings.py" = ["T201", "TC003", "PLW3201", "S101", "PLW0717", "BLE001"]
# `sources.py` fails fast at import when a new InstallSource lacks wiring
# (label/upgrade-command tables), turning a latent KeyError into a loud error.
"src/keycast/updates/sources.py" = ["S101"]
# Input-capture code degrades gracefully by design: a listener/display failure
# must never crash the overlay, so broad `except Exception` handlers (BLE001)
# and the multi-statement try blocks around them (PLW0717) are the error policy,
# not tech debt. Probe caching uses module-level globals (PLW0603) for the same
# lazy-init reason the imports stay function-local (PLC0415).
"src/keycast/display.py" = ["BLE001", "PLW0717"]
"src/keycast/listeners.py" = ["BLE001", "PLW0717"]
"src/keycast/secure_input.py" = ["BLE001", "PLW0603", "PLC0415"]
# The same degrade-gracefully policy in the orchestration layers: startup,
# shutdown, and settings-load handlers must not let an input/logging failure
# escape and crash the app (mirrors the pylint broad-exception-caught disable).
"src/keycast/application.py" = ["BLE001"]
"src/keycast/main.py" = ["BLE001"]
"src/keycast/logging_setup.py" = ["BLE001"]
"src/keycast/updates/*.py" = ["BLE001", "PLW0717", "PLR0913", "PLR0911"]
"src/keycast/updates/__init__.py" = ["RUF067", "PLC0415"]


[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true


[tool.ruff.lint.ruff]
# `parenthesize-tuple-in-subscript = true` (the template default) rewrites
# `dict[str, str]` into `dict[(str, str)]`, whose parenthesized form zuban's
# parser rejects (gate failure). Unparenthesized is valid for every checker,
# so the tuple parens stay off project-wide.
parenthesize-tuple-in-subscript = false


[tool.mypy]
files = ["src"]
pretty = true
python_version = "3.14"
strict = true


[tool.basedpyright]
exclude = [".venv"]
include = ["src/keycast"]
pythonVersion = "3.14"
venv = ".venv"
# venvPath is the directory *containing* the venv, not the venv itself; ".venv"
# here would make basedpyright look for ".venv/.venv". Use "." so both the venv
# and basedpyright's strict ruleset resolve the project's installed deps.
venvPath = "."
# Adjacent-string continuation (the idiomatic way to wrap long messages and
# descriptions) is project style, governed by ruff format — not a diagnostic.
reportImplicitStringConcatenation = false
# keycast integrates dynamic runtimes whose types are unknowable statically:
# the pyobjc bridge (display.py), ctypes handles (application.py), and
# decoded JSON / stdlib duck-types (urllib response, settings presets, update
# state). Unknown-typed values at those boundaries are inherent, so the
# Any/Unknown family is off; the structural rules that remain (unannotated
# attributes, unused results, overrides, private usage) still gate real defects,
# and mypy strict keeps enforcing the annotated surface.
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false


# Type checkers are scoped to `src` only: the test suite intentionally passes
# plain dicts where the runtime accepts read-only mappings, which the checkers
# would (correctly) reject. Production code must stay clean; tests need not.
[tool.ty.src]
include = ["src"]
respect-ignore-files = false


[tool.ty.environment]
python-version = "3.14"


[tool.ty.terminal]
error-on-warning = true


[tool.pyrefly]
python-version = "3.14"
project-includes = ["src"]

[tool.pylint.main]
# pylint runs as an always-on gate that deliberately overlaps ruff's PL* rules.
# Its canonical invocation is `pylint src`, so it never descends into tests; this
# ignore-paths is a defensive scope guard for broader invocations (`pylint .`,
# filename-passing hooks). Tests are linted by ruff, not pylint.
ignore-paths = ["^tests/.*$"]
# `.pyi` stubs (the c-extension type stub) are signature-only: their bodies are
# `...` and every parameter is unused by construction, so pylint's unused-argument
# check is a guaranteed false positive there. Stubs are type-checked by the
# type-checker gate, not pylint.
ignore-patterns = ['.*\.pyi$']

[tool.pylint."messages control"]
# Only formatter-owned checks, the docstring family, and too-few-public-methods
# are disabled so pylint is usable out of the box; everything else stays on.
disable = [
  "line-too-long", # C0301 — ruff-format owns line length
  "missing-module-docstring", # C0114
  "missing-class-docstring", # C0115
  "missing-function-docstring", # C0116
  "too-few-public-methods", # R0903 — trips dataclasses / config / Protocol classes
  # C0415 — the cli->tui/gui/web dispatch, and each component's own heavy or
  # platform-conditional import (tkinter, uvicorn, the worker's uvloop probe),
  # are deliberately lazy so import-linter's layering contract holds and a
  # framework is only imported when the code path that needs it actually runs.
  # Textual is the exception: the TUI imports it at module scope so `InfoApp`
  # can be defined there and driven by the headless pilot.
  "import-outside-toplevel",
  # W0706 — the generated TUI entry point explicitly re-raises
  # KeyboardInterrupt/SystemExit ahead of a broad `except Exception` to make the
  # "let these propagate" intent obvious to readers, even though BaseException
  # subclasses wouldn't be caught by the Exception clause anyway.
  "try-except-raise",
